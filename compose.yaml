services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: testdisha_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: testdisha
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - testdisha_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testdisha_owner -d testdisha"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  testdisha_postgres:
